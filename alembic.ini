[alembic]
script_location = src/impostarr/migrations
# Placeholder for CLI use (e.g. `alembic revision --autogenerate`); the app
# itself builds a programmatic Config in impostarr.db.init_db and never
# reads this file.
sqlalchemy.url = sqlite:///impostarr.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
