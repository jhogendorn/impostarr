# Demo/e2e stack: real Sonarr + a synthetic library + a stub
# transcription/chat-completions server (stub_services.py) + Impostarr
# itself (dry_run always on — see impostarr.demo.yml). Driven by e2e.sh;
# see README "Demo / e2e" section. Run from this directory (`cd demo &&
# docker compose ...`) — e2e.sh does this for you.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Etc/UTC
    volumes:
      - ./volumes/sonarr-config:/config
      - ./volumes/media:/media
    ports:
      - "8989:8989"
    restart: unless-stopped

  stub-services:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./volumes/manifest:/manifest:ro
    restart: unless-stopped

  impostarr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - sonarr
      - stub-services
    volumes:
      - ./volumes/config:/config
      - ./volumes/assets:/assets
      - ./volumes/models:/models
      - ./volumes/media:/media:ro
      - ./volumes/trash:/trash
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      IMPOSTARR_CONFIG: /config/impostarr.yml
    ports:
      - "8484:8484"
    restart: unless-stopped
