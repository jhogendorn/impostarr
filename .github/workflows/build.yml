name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg (asset-extraction tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Backend tests
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Frontend tests
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Print image digest
        if: github.event_name == 'push'
        run: |
          echo "Image digest (pin this in the 29c.sh kit):"
          echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
