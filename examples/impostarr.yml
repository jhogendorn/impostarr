# Impostarr configuration reference.
#
# Bind-mount at /config/impostarr.yml. Every key below is optional; omitted
# sections/keys fall back to their defaults. Any value can be overridden at
# the environment level: IMPOSTARR__SECTION__KEY=value for scalars,
# IMPOSTARR__SECTION=<json> for list/object-valued keys (e.g.
# IMPOSTARR__SONARR='[{"name": "main", ...}]'). Env always wins over this
# file.

# One entry per Sonarr instance to watch. Default: [] (no instances).
sonarr:
  - name: main # unique identifier for this instance
    url: http://sonarr:8989
    api_key: CHANGE_ME
    # Container path -> Sonarr path mappings, used to translate paths Sonarr
    # reports into paths this container can read. Longest-prefix match wins.
    path_mappings:
      - sonarr: /tv
        local: /media/tv
    # Sonarr-visible staging dir for remap choreography (manual import).
    # Must be on the same filesystem as the library so hardlinks work.
    staging_dir: /media/staging/main
    # Path filters (local paths) restricting which files are eligible.
    # Empty list = watch everything.
    watch_dirs: []
    poll_interval_s: 300
    # Per-instance enable flags for automatic remediation verbs. When
    # false, the corresponding proposed action queues for human approval
    # instead of acting automatically.
    auto_remap: false
    auto_replace: false

# Every file gets a confidence score 0..1 that it really is the episode
# it's labelled as. These thresholds are a decision ladder that score sorts
# into an action. All values below are the defaults.
thresholds:
  # Scores at or above this are considered verified ("matched") — no action
  # taken.
  quarantine: 0.8
  # Scores below this trigger automatic remediation, if the sonarr
  # instance's auto_remap/auto_replace flags allow it. Scores between
  # `auto` and `quarantine` are neither verified nor low-confidence enough
  # to auto-act on: they go to the quarantine queue for a human to review.
  auto: 0.4
  # Before remediating a low-confidence file, Impostarr checks whether the
  # plugins agreed it's actually a *different* episode than labelled. That
  # alternative candidate needs a score of at least `alt`...
  alt: 0.8
  # ...AND must beat the labelled episode's score by at least this margin
  # to be trusted. Only then is the file re-mapped to the alternative
  # instead of being deleted/replaced.
  alt_margin: 0.2
  # Automatic actions (remap/replace) additionally require at least this
  # many plugins to have returned usable evidence (status "ok" — abstained
  # or errored plugins don't count) — a single plugin's opinion is never
  # enough to act automatically, even if very confident.
  auto_min_evidence: 2
  # Minimum verdict confidence before a file's visual fingerprint (phash)
  # is added to the local corpus used for future frame-hash comparisons.
  phash_store: 0.9

# External identifier plugins.
plugins:
  # Pinned pip specs for external plugin collections, installed at boot
  # into a dedicated venv overlay. Supports git+https://...@tag#subdirectory=...
  sources: []
  # Per-plugin config keyed by plugin name.
  identifiers:
    whisper-subs:
      enabled: true
      weight: 1.0
      # Max EXECUTIONS (identify() calls, not cache hits) per UTC day for
      # this plugin; unset = unlimited. Exceeding it skips the call and
      # synthesizes an abstain ("daily budget reached") instead -- a
      # per-plugin companion to the pool-wide throttle: section above,
      # useful for capping a paid/rate-limited backend independently of
      # overall job throughput. Available on every plugin, not just this one.
      # daily_budget: 500
      options:
        min_lines: 20 # minimum transcript segments required to attempt a comparison
        min_compared: 10 # reference lines below which match confidence is discounted
    subs-llm:
      enabled: true
      weight: 1.0
      options:
        base_url: http://ollama:11434/v1
        model: llama3
        api_key: CHANGE_ME
        # Example: any OpenAI-compatible endpoint works here (Ollama,
        # LocalAI, llama.cpp server, vLLM) — no API key needed for a local
        # Ollama instance.
        # base_url: http://ollama:11434/v1
        # model: llama3.1
        # api_key: ""
        #
        # Optional ordered provider failover list -- takes precedence over
        # base_url/model/api_key above when set. Tried in order; falls
        # through to the next provider only when one looks unavailable
        # (401/402/403/429, an insufficient_quota error body, a persistent
        # 5xx, or a transport error) -- not on a bad/unparseable reply from
        # a reachable provider, which surfaces as an error instead.
        # providers:
        #   - name: primary
        #     base_url: http://ollama:11434/v1
        #     model: llama3.1
        #     api_key: ""
        #   - name: fallback
        #     base_url: https://api.openai.com/v1
        #     model: gpt-4o-mini
        #     api_key: CHANGE_ME
    transcript-llm:
      enabled: false
      weight: 1.0
      options:
        base_url: http://ollama:11434/v1
        model: llama3
        api_key: CHANGE_ME
        min_segments: 20 # minimum transcript segments required to attempt identification
        max_segments: 100 # transcript segments sent per request
        # Same config shape as subs-llm above (base_url/model/api_key as
        # the single-provider case, or an equivalent `providers:` failover
        # list) -- identifies from the whisper transcript instead of
        # embedded subtitles, so it also covers files with no embedded
        # subs. Disabled by default since it duplicates subs-llm's job
        # when both embedded subs and a transcript are available; useful
        # as the LLM-based identifier when only a transcript exists.

# Reference subtitle service (OpenSubtitles), shared by identifier plugins.
refsubs:
  api_key: null
  username: null
  password: null
  daily_quota: 20
  cache_dir: /assets/refsubs
  # Manual local-SRT drop-in directory, checked before cache/API. Layout:
  # <manual_dir>/<tvdb_id>/SxxEyy.<lang>.srt (e.g. S01E02.ja.srt), falling
  # back to the legacy unsuffixed SxxEyy.srt if no language-suffixed file
  # is present.
  manual_dir: /config/refsubs-manual
  # Fallback language preference order (ISO 639-1), tried after whatever
  # language a caller passes (e.g. whisper-subs passes the transcript's
  # detected language first) -- so a Japanese-audio file is compared
  # against Japanese subs instead of always assuming English.
  languages: ["en"]

# Identity/audit layer. Impostarr does not currently have a requirement for
# access control: all actions are admin actions. Users who need
# authentication should deploy the app behind an auth service (e.g.
# Authentik); Impostarr will attribute actions to the identity the proxy
# passes through (trusted_header, below).
auth:
  # Forward-auth header name (e.g. Authentik), attributes identity for audit.
  trusted_header: null
  # Optional group gate: when both are set, requests without a matching
  # group header value get 403.
  group_header: null
  required_group: null
  # Static API keys for automation (sent as X-Api-Key).
  api_keys: []
  # - name: automation
  #   key: CHANGE_ME

# Database. SQLite is the default and needs no configuration: with the
# `db:` section absent, Impostarr uses a SQLite file at
# <state_dir>/impostarr.db.
#
# PostgreSQL is optional, needed only for multi-replica deployments.
# Uncomment below and set dsn to switch. Requires the `postgres` extra
# (psycopg) — install with `uv sync --extra postgres`, or use the docker
# image built from this repo (docker/Dockerfile includes it).
# db:
#   dsn: postgresql+psycopg://user:pass@postgres:5432/impostarr  # leave unset for SQLite (default)

# Worker pool.
workers:
  pool_size: 2

  # Transcription backend — a deployment choice, not fixed: pick whichever
  # fits the box this runs on. All four are always available (never a dead
  # identifier), selected by entry-point name:
  #   faster-whisper (default) - CPU by default; NVIDIA GPU via CUDA
  #     (set whisper_device: cuda below and run the container with
  #     --gpus all). No extra setup for CPU.
  #   whisper-cpp - CPU everywhere (small wheel, no compiler); can also be
  #     source-built with Vulkan for Intel/AMD iGPU acceleration (not done
  #     by the prebuilt image — see README GPU section).
  #   remote - talks to any OpenAI-compatible /v1/audio/transcriptions
  #     server (e.g. speaches, faster-whisper-server) running wherever the
  #     GPU actually lives. Recommended when this box has no usable GPU
  #     (e.g. Intel iGPU only) — see the commented example below.
  #   none - disables transcription; transcript-dependent plugins
  #     (whisper-subs) abstain.
  transcriber: faster-whisper

  # whisper_model: model-size name, shared by faster-whisper and
  # whisper-cpp. whisper_device: CPU/CUDA selector, faster-whisper only.
  whisper_model: small
  whisper_device: auto # auto | cpu | cuda

  # Backend-specific options for whisper-cpp/remote. Ignored by
  # faster-whisper/none.
  transcriber_options: {}
  # Example: remote backend pointing at a speaches/faster-whisper-server
  # container running on a GPU box elsewhere on the network.
  # transcriber: remote
  # transcriber_options:
  #   base_url: http://gpu-box:8000/v1
  #   model: Systran/faster-whisper-small
  #   api_key: ""  # leave empty if the server doesn't require one

# Dry run. Strongly recommended for first runs against a real library: no
# files are touched, no Sonarr state is changed; every action is logged as
# "DRY-RUN would ...". Scoping: only Sonarr API mutations (delete, search,
# manual import, blocklist) and media-library file operations (the
# hardlink/copy into staging) are suppressed. Impostarr's own database and
# asset extraction (transcripts, framegrabs, phash corpus) still run — those
# are impostarr's own artifacts, not the library. Jobs still transition to
# `remediated` in dry-run (queue flow observable end-to-end); the
# remediation_log audit trail records what would have happened.
dry_run: false

# Never take automatic actions; every proposed fix waits in the quarantine
# queue for human approval. Overrides the per-instance auto_remap/
# auto_replace flags.
approval_required: false

# When enabled, files removed by the replace action are first
# copied/hardlinked into the trash directory and kept for retention_days
# before being deleted permanently. Disable to delete immediately.
trash:
  enabled: true
  dir: /trash
  retention_days: 14

# Worker-pool scheduling controls (see README's Throttling section).
throttle:
  # "HH-HH" hour range (0-23, UTC, both bounds inclusive), wrapping past
  # midnight allowed (e.g. "22-06" = active 22:00 through 06:59); null =
  # always active.
  active_hours: null
  # Max job claims per rolling hour across the whole worker pool; null =
  # unlimited.
  jobs_per_hour: null
  # Startup default for the pause flag. Flippable at runtime without
  # touching this file via POST /api/v1/pause and /resume (or the UI's
  # Pause/Resume button) -- this value only applies at boot.
  paused: false

# Volumes (see README).
state_dir: /config # SQLite DB, watermarks, lock-hashes, plugin venv overlay
assets_dir: /assets # extracted artifact blobs (transcripts, framegrabs, refsub cache)
models_dir: /models # whisper/LLM model caches
