[project]
name = "impostarr"
version = "0.1.0"
description = "Post-import content verification for Sonarr"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pyyaml",
    "xxhash>=3.8.1",
    "imagehash>=4.3",
    "pillow>=10",
    "rapidfuzz==3.14.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.entry-points."impostarr.identifiers"]
whisper-subs = "impostarr.plugins.whisper_subs:WhisperSubsPlugin"
subs-llm = "impostarr.plugins.subs_llm:SubsLlmPlugin"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    # Needed for tests/test_db.py's postgresql+psycopg dialect check (SQLAlchemy
    # resolves the DBAPI module at create_engine() time even without connecting).
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impostarr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
