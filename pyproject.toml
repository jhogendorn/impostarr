[project]
name = "impostarr"
version = "0.1.0"
description = "Post-import content verification for Sonarr"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pyyaml",
    "xxhash>=3.8.1",
    "imagehash>=4.3",
    "pillow>=10",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impostarr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
